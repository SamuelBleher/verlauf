<!doctype html><html lang="de"><meta charset="utf-8"><title>Demodaten</title>
<body style="font:15px system-ui;padding:20px">
<h1 style="font-size:17px">Demodaten</h1>
<p id="out">…</p>
<script type="module">
// Nur für Tests: legt einen nachvollziehbaren Verlauf an und ersetzt dabei
// vorhandene Demodaten, damit wiederholte Läufe nicht duplizieren.
import * as db from '../js/db.js';
import { emptyEntry, emptyCondition, CONDITION_COLORS } from '../js/models.js';
await db.wipeAll();
const c1 = emptyCondition({ name:'Knie links — Innenmeniskus', bodyPart:'Knie', side:'links', status:'reha', startDate:'2026-03-07', color:CONDITION_COLORS[0], notes:'Konservativ behandeln, Kontrolle in 6 Wochen.' });
const c2 = emptyCondition({ name:'Unterer Rücken', bodyPart:'Unterer Rücken', status:'chronisch', startDate:'2024-11-02', color:CONDITION_COLORS[3] });
await db.saveCondition(c1); await db.saveCondition(c2);
const rows = [
  ['2026-03-07','09:20','verletzung','Umgeknickt beim Fußball',9,c1,'Beim Zweikampf weggeknickt. Sofort dick geworden, konnte nicht mehr auftreten.','Sofort gekühlt und hochgelegt.','',''],
  ['2026-03-09','15:00','arzt','Erstvorstellung Orthopädie',7,c1,'Verdacht auf Innenmeniskusriss, MRT angeordnet.','','Dr. Weber','Praxis Süd'],
  ['2026-03-14','11:30','befund','MRT linkes Knie',6,c1,'Horizontalriss Innenmeniskus Hinterhorn. Kein Kreuzbandschaden.','','Radiologie Nord',''],
  ['2026-03-20','17:45','physio','Physio — Einheit 1',5,c1,'Mobilisation, viel Quadrizeps.','Isometrie im Sitzen hat den Druck rausgenommen.','Frau Klein',''],
  ['2026-04-02','18:00','physio','Physio — Einheit 4',3,c1,'Deutlich besser, erste Kniebeugen ohne Schmerz.','Exzentrik langsam, Wärme vorher.','Frau Klein',''],
  ['2026-04-18','07:30','sport','Erster Lauf, 4 km',2,c1,'Vorsichtig gelaufen, kein Stechen.','','',''],
  ['2026-04-24','20:10','tagebuch','Nach langem Sitzen steif',3,c1,'Büro-Tag, abends steif aber schmerzfrei.','Aufstehen alle 30 Minuten.','',''],
  ['2026-05-11','08:00','arzt','Kontrolle',1,c1,'Alles stabil, freigegeben für Sport.','','Dr. Weber','Praxis Süd'],
  ['2026-02-14','21:00','tagebuch','Rücken nach Umzug',6,c2,'Kisten geschleppt, unterer Rücken macht dicht.','Wärmepflaster über Nacht.','',''],
  ['2026-01-08','12:00','sonstiges','Rezept abgeholt',null,c2,'Ohne Schmerzangabe — prüft die Darstellung ohne Balken.','','','']
];
for (const [date,time,type,title,pain,cond,body,helped,prac,place] of rows)
  await db.saveEntry(emptyEntry({ date, time, type, title, pain, conditionId:cond.id, body, helped, practitioner:prac, place }));
// Anhänge an den Befund hängen, damit die Prüfung auch Bild- und Audiokarten sieht.
const befund = (await db.listEntries()).find(e => e.type === 'befund');
const cv = document.createElement('canvas'); cv.width = 240; cv.height = 320;
const g = cv.getContext('2d');
g.fillStyle = '#c8ccd0'; g.fillRect(0, 0, 240, 320);
g.fillStyle = '#333'; g.font = '16px sans-serif'; g.fillText('MRT-Befund', 20, 40);
const png = await new Promise(r => cv.toBlob(r, 'image/png'));

// Ein Sekunde 8-kHz-Mono-WAV von Hand, damit ein echtes Audioelement entsteht.
const n = 8000, buf = new ArrayBuffer(44 + n), dv = new DataView(buf);
const put = (o, str) => [...str].forEach((ch, i) => dv.setUint8(o + i, ch.charCodeAt(0)));
put(0, 'RIFF'); dv.setUint32(4, 36 + n, true); put(8, 'WAVEfmt ');
dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
dv.setUint32(24, 8000, true); dv.setUint32(28, 8000, true);
dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
put(36, 'data'); dv.setUint32(40, n, true);
for (let i = 0; i < n; i++) dv.setUint8(44 + i, 128 + Math.round(40 * Math.sin(i / 12)));
const wav = new Blob([buf], { type: 'audio/wav' });

const { newId } = await import('../js/models.js');
const stamp = new Date().toISOString();
await db.put('attachments', { id: newId('a'), entryId: befund.id, blob: png, thumb: png,
  kind: 'image', name: 'MRT Seite 1.png', bytes: png.size, seconds: 0, ext: 'png',
  mime: 'image/png', path: null, createdAt: stamp, updatedAt: stamp, dirty: 1, deleted: 0 });
await db.put('attachments', { id: newId('a'), entryId: befund.id, blob: wav, thumb: null,
  kind: 'audio', name: 'Gespräch Radiologie.wav', bytes: wav.size, seconds: 1, ext: 'wav',
  mime: 'audio/wav', path: null, consent: 'mündlich eingeholt',
  createdAt: stamp, updatedAt: stamp, dirty: 1, deleted: 0 });

document.getElementById('out').textContent = 'fertig: ' + rows.length + ' Einträge, 2 Themen, 2 Anhänge (' + befund.id + ')';
</script></body></html>
