<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verlauf — Diagnose</title>
<style>
  /* Bewusst ohne externe Dateien und ohne Farbschema-Tricks:
     diese Seite muss auch dann lesbar sein, wenn alles andere kaputt ist. */
  html { background: #fff; color: #111; }
  body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, sans-serif;
         background: #fff; color: #111; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: #555; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td { padding: 7px 4px; border-bottom: 1px solid #ddd; vertical-align: top; }
  td:first-child { color: #555; width: 42%; }
  .ok { color: #127a3d; font-weight: 600; }
  .bad { color: #b3261e; font-weight: 600; }
  pre { background: #f3f3f3; padding: 10px; border-radius: 6px; font-size: 12px;
        white-space: pre-wrap; word-break: break-word; margin: 14px 0; }
  button { font: inherit; padding: 12px 16px; border-radius: 8px; border: 1px solid #bbb;
           background: #fff; width: 100%; margin-top: 10px; min-height: 48px; }
  button.go { background: #0C7188; color: #fff; border-color: #0C7188; font-weight: 600; }
</style>
</head>
<body>
<h1>Verlauf — Diagnose</h1>
<p class="sub">Was dieses Gerät kann und was gerade zwischengespeichert ist.</p>
<table id="t"></table>
<h2 style="font-size:15px;margin:18px 0 4px">App-Module</h2>
<table id="m"></table>
<h2 style="font-size:15px;margin:18px 0 4px">App im Rahmen geladen</h2>
<pre id="frame">läuft …</pre>
<iframe id="probe" src="about:blank" style="width:1px;height:1px;opacity:0;border:0;position:absolute;left:-9999px"></iframe>
<pre id="log">läuft …</pre>
<button class="go" id="reset">Cache und Service Worker löschen</button>
<button id="open">App öffnen (ohne Cache)</button>

<script>
// Klassisches Script, kein Modul: läuft auch, wenn die Modul-Kette scheitert.
var rows = [], notes = [];
function add(label, value, good) {
  rows.push('<tr><td>' + label + '</td><td class="' +
    (good === true ? 'ok' : good === false ? 'bad' : '') + '">' + value + '</td></tr>');
  document.getElementById('t').innerHTML = rows.join('');
}
window.onerror = function (m, s, l) { notes.push('Fehler: ' + m + ' (' + s + ':' + l + ')'); draw(); };
function draw() { document.getElementById('log').textContent = notes.join('\n') || 'Keine Fehler aufgetreten.'; }

add('Browser', navigator.userAgent.replace(/^Mozilla\/5\.0 /, ''));
add('Als App installiert', window.matchMedia('(display-mode: standalone)').matches || navigator.standalone ? 'ja' : 'nein');

add('ES-Module', 'HTMLScriptElement' in window && 'noModule' in document.createElement('script') ? 'unterstützt' : 'FEHLT', 'noModule' in document.createElement('script'));
add('Array.at()', typeof Array.prototype.at === 'function' ? 'ja' : 'FEHLT', typeof Array.prototype.at === 'function');
add('color-mix()', window.CSS && CSS.supports && CSS.supports('color', 'color-mix(in srgb, red 50%, blue)') ? 'ja' : 'nein (nur Optik)');
add('MediaRecorder', 'MediaRecorder' in window ? 'ja' : 'nein (keine Aufnahme)');
add('Service Worker', 'serviceWorker' in navigator ? 'ja' : 'nein');

// IndexedDB — der häufigste Grund für eine leere Seite
if (!window.indexedDB) { add('IndexedDB', 'FEHLT', false); notes.push('Ohne IndexedDB startet die App nicht. Im privaten Modus ist das normal.'); draw(); }
else {
  try {
    var req = indexedDB.open('verlauf-diagnose', 1);
    req.onsuccess = function () { add('IndexedDB', 'funktioniert', true); try { req.result.close(); indexedDB.deleteDatabase('verlauf-diagnose'); } catch (e) {} };
    req.onerror = function () { add('IndexedDB', 'blockiert', false); notes.push('IndexedDB wird verweigert — privates Surfen oder Speicher voll.'); draw(); };
    req.onblocked = function () { add('IndexedDB', 'blockiert', false); };
  } catch (e) { add('IndexedDB', 'Fehler: ' + e.message, false); }
}

// Welche Fassung liegt im Cache, welche liegt auf dem Server?
fetch('./index.html?bust=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { return r.text(); })
  .then(function (t) {
    add('Server liefert', t.indexOf('boot-note') !== -1 ? 'neue Fassung' : 'ALTE Fassung', t.indexOf('boot-note') !== -1);
  })
  .catch(function (e) { add('Server erreichbar', 'nein: ' + e.message, false); });

fetch('./index.html')
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var neu = t.indexOf('boot-note') !== -1;
    add('Dein Gerät sieht', neu ? 'neue Fassung' : 'ALTE Fassung (Cache!)', neu);
    if (!neu) notes.push('Dein Gerät bekommt eine veraltete Kopie. Unten auf "Cache und Service Worker löschen" tippen.');
    draw();
  })
  .catch(function (e) { add('Lokaler Abruf', 'Fehler: ' + e.message, false); });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (rs) {
    add('Registrierte Worker', rs.length ? rs.length + ' aktiv' : 'keiner');
  });
}
if (window.caches) {
  caches.keys().then(function (ks) { add('Cache-Speicher', ks.length ? ks.join(', ') : 'leer'); });
}

// Feature-Detect sagt nur, dass der Browser Module KENNT. Hier werden sie wirklich geladen.
var MODULES = ['./js/models.js','./js/markdown.js','./js/repo.js','./js/db.js','./js/images.js',
               './js/audio.js','./js/github.js','./js/sync.js','./js/ui/components.js',
               './js/ui/timeline.js','./js/ui/entry-edit.js','./js/ui/entry-view.js',
               './js/ui/conditions.js','./js/ui/search.js','./js/ui/settings.js','./js/app.js'];
var mrows = [];
function mrow(name, value, good) {
  mrows.push('<tr><td>' + name + '</td><td class="' + (good ? 'ok' : 'bad') + '">' + value + '</td></tr>');
  document.getElementById('m').innerHTML = mrows.join('');
}
(function next(i) {
  if (i >= MODULES.length) { mrow('alle Module', 'geladen', true); return; }
  var name = MODULES[i];
  var t0 = Date.now();
  // app.js startet beim Import die App — deshalb zuletzt und getrennt gemeldet.
  import(name + '?diag=' + t0).then(function () {
    if (name === './js/app.js') mrow(name, 'geladen', true);
    next(i + 1);
  }).catch(function (e) {
    mrow(name, String(e && (e.message || e)).slice(0, 180), false);
    notes.push('Modul ' + name + ' scheitert: ' + (e && (e.stack || e.message || e)));
    draw();
    next(i + 1);
  });
})(0);

// Die echte App in einem Rahmen starten und nachsehen, was sie anzeigt.
(function () {
  var f = document.getElementById('probe');
  var out = document.getElementById('frame');
  f.src = './index.html?imframe=' + Date.now();
  setTimeout(function () {
    try {
      var d = f.contentDocument;
      var view = d.getElementById('view');
      var txt = (view ? view.innerText : d.body.innerText) || '';
      txt = txt.replace(/\s+/g, ' ').trim();
      out.textContent = txt ? 'Die App zeigt: "' + txt.slice(0, 220) + '"'
                            : 'Die App zeigt NICHTS — #view ist leer.';
    } catch (e) { out.textContent = 'Rahmen nicht lesbar: ' + e.message; }
  }, 5000);
})();

document.getElementById('reset').onclick = function () {
  var btn = this; btn.textContent = 'räume auf …';
  var jobs = [];
  if ('serviceWorker' in navigator)
    jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) { return r.unregister(); }));
    }));
  if (window.caches) jobs.push(caches.keys().then(function (ks) {
    return Promise.all(ks.map(function (k) { return caches.delete(k); }));
  }));
  Promise.all(jobs).then(function () {
    btn.textContent = 'Fertig — App wird geöffnet';
    location.replace('./?frisch=' + Date.now());
  });
};
document.getElementById('open').onclick = function () { location.replace('./?frisch=' + Date.now()); };
draw();
</script>
</body>
</html>
